<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8">

<title>Historical East Asian Trade Network</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{

margin:0;
font-family:Arial;

}

h1{

text-align:center;
margin-top:20px;

}

#toolbar{

text-align:center;
margin-bottom:15px;

}

button{

padding:8px 14px;
margin:5px;
font-size:15px;
cursor:pointer;

}

#map{

width:100%;
height:85vh;

}

</style>

</head>

<body>

<h1>Historical East Asian Trade Network (1392–1450)</h1>

<div id="toolbar">

<button>Taejo–Jeongjong</button>

<button>Taejong</button>

<button>Sejong</button>

<br><br>

<button>Overall</button>

<button>Exports</button>

<button>Imports</button>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

var map=L.map('map').setView([37,128],5);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:18
}
).addTo(map);

</script>

</body>

</html>
